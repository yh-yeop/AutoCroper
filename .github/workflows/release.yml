name: Windows 설치 파일 빌드

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 코드 서명 안 함
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 태그와 package.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v${pkg}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그(${GITHUB_REF_NAME})와 package.json 버전(v${pkg})이 다릅니다."
            exit 1
          fi

      - name: Electron 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: 설치 파일 빌드 (NSIS x64)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 워크플로 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: AutoCroper-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: GitHub 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
